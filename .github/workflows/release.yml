name: Release

# Builds the installer + portable zip and attaches them to the GitHub release.
# Runs when a tag like v1.0.1 is pushed, or when a release is published on github.com.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version from the tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/RigGlow/RigGlow.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "release/RigGlow-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.ver.outputs.version }}" installer/RigGlow.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Fixed name so https://github.com/<owner>/RigGlow/releases/latest/download/RigGlow-Setup.exe always works
          Copy-Item "release/RigGlow-${{ steps.ver.outputs.version }}-Setup.exe" "release/RigGlow-Setup.exe"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RigGlow-${{ steps.ver.outputs.version }}
          path: release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
